stages:
  - lint
  - audit
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"

default:
  image: python:3.13-slim
  before_script:
    - pip install uv
    - uv sync --extra dev
  cache:
    paths:
      - .cache/pip
      - .cache/uv
      - .venv

ruff-check:
  stage: lint
  script:
    - uv run ruff check .

ruff-format:
  stage: lint
  script:
    - uv run ruff format --check .

pip-audit:
  stage: audit
  script:
    - uv run pip-audit
  allow_failure: true

pytest:
  stage: test
  script:
    - uv run pytest --cov --cov-report=xml --cov-report=term
  coverage: '/TOTAL.*\s+(\d+%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week
